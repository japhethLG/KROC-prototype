<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>KROC Centers — Mobile · All Screens</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link rel="stylesheet" href="kroc-mobile.css"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  html,body{margin:0;background:#1a1a1a;overflow-x:hidden}
  .g-stage{background:#1a1a1a;min-height:100vh;padding:44px 20px 140px}
  .g-head{max-width:920px;margin:0 auto 40px;color:#fff;font-family:'Creato Display','Helvetica Neue',Helvetica,Arial,sans-serif}
  .g-head .brand{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .g-head .mk{width:30px;height:30px;border-radius:8px;background:#EF3E42;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:13px}
  .g-head h1{font-size:30px;font-weight:500;margin:0 0 8px;letter-spacing:-.01em}
  .g-head p{color:#9a9a9f;font-size:14px;margin:0;max-width:660px;line-height:1.6}
  .g-list{display:flex;flex-direction:column;align-items:center;gap:60px}
  .g-item{scroll-margin-top:20px}
  .g-label{display:flex;align-items:center;gap:12px;width:402px;max-width:402px;margin:0 auto 14px;color:#bbb;font-family:'Creato Display','Helvetica Neue',Helvetica,Arial,sans-serif}
  .g-label .tag{font-size:10.5px;padding:3px 8px;border-radius:4px;background:#2a2a2e;color:#aaa;font-family:'SF Mono',Menlo,monospace;letter-spacing:.03em}
  .g-label .name{color:#fff;font-size:15px;font-weight:500}
  .g-label .meta{color:#666;margin-left:auto;font-size:12px;font-family:'SF Mono',Menlo,monospace}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="m-shared.jsx"></script>
<script type="text/babel" src="m-pages-a.jsx"></script>
<script type="text/babel" src="m-pages-b.jsx"></script>
<script type="text/babel" src="m-library.jsx"></script>

<script type="text/babel" data-presets="react">
const { useState, useRef } = React;

const PAGES = {
  home: Page_Home, programs: Page_AllPrograms, "program-cat": Page_ProgramCategory,
  class: Page_ClassDetail, info: Page_Info, stories: Page_AllStories, story: Page_StoryDetail,
  tags: Page_AllTags, tag: Page_TagDetail, events: Page_Events, event: Page_EventDetail,
  contact: Page_Contact, volunteers: Page_Volunteers, "volunteer-detail": Page_VolunteerDetail,
  library: Page_Library,
};

// scroll the whole board to a given page's frame
function gotoFrame(r) {
  const el = document.getElementById("f-" + r);
  if (!el) return;
  const top = el.getBoundingClientRect().top + window.scrollY - 16;
  const startY = window.scrollY;
  try { window.scrollTo({ top, behavior: "smooth" }); } catch (e) { window.scrollTo(0, top); }
  // fall back to an instant jump if smooth scrolling is a no-op in this environment
  setTimeout(() => { if (window.scrollY === startY && Math.abs(top - startY) > 4) window.scrollTo(0, top); }, 80);
}

function JumpNav() {
  const [open, setOpen] = useState(false);
  return (
    <div className="jump">
      <button className="jump-toggle" onClick={() => setOpen(o => !o)}><span>≡</span> Screens</button>
      {open && (
        <div className="jump-panel">
          <div className="jump-h">KROC Mobile · 14 pages</div>
          {SCREENS.map(([n, l, r]) => (
            <button key={r} onClick={() => { gotoFrame(r); setOpen(false); }}>
              <span className="n">{n}</span><span>{l}</span>
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

function PhoneFrame({ n, name, route }) {
  const [menu, setMenu] = useState(false);
  const scrollRef = useRef(null);
  const Comp = PAGES[route] || Page_Home;
  const navValue = {
    navigate: (r) => { setMenu(false); gotoFrame(r); },
    route, openMenu: () => setMenu(true), navPattern: "Slide-up drawer", stickyOn: false,
  };
  return (
    <div className="g-item" id={"f-" + route}>
      <div className="g-label">
        <span className="tag">{n}</span>
        <span className="name">{name}</span>
        <span className="meta">{route}</span>
      </div>
      <IOSDevice>
        <div className="m-app">
          <Nav.Provider value={navValue}>
            <div className="m-scroll" ref={scrollRef}>
              <Comp />
              <div className="m-bottompad" />
            </div>
            <NavDrawer open={menu} onClose={() => setMenu(false)} active={route} variant="sheet" />
          </Nav.Provider>
        </div>
      </IOSDevice>
    </div>
  );
}

function App() {
  return (
    <div className="g-stage">
      <header className="g-head">
        <div className="brand"><span className="mk">K</span><span style={{ fontSize: 15, color: "#bbb", fontFamily: "'Creato Display',Helvetica,Arial,sans-serif" }}>KROC Centers · Mobile Prototype</span></div>
        <h1>All Screens — one scrollable board</h1>
        <p>Every KROC mobile page and the component library, each in its own iPhone, laid out top to bottom. Use <b style={{ color: "#ddd" }}>Screens</b> (top-right) to jump to any frame. Within each phone the menu, filters, tabs, and accordions all work — and links scroll the board to the target screen. For the single navigable app version, see <b style={{ color: "#ddd" }}>KROC Mobile.html</b>.</p>
      </header>
      <div className="g-list">
        {SCREENS.map(([n, name, route]) => <PhoneFrame key={route} n={n} name={name} route={route} />)}
      </div>
      <JumpNav />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

<template id="__bundler_thumbnail">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#1a1a1a"/><rect x="20" y="18" width="26" height="44" rx="6" fill="#EF3E42"/><rect x="54" y="18" width="26" height="44" rx="6" fill="#fff"/><rect x="20" y="68" width="26" height="20" rx="5" fill="#fff"/><rect x="54" y="68" width="26" height="20" rx="5" fill="#002056"/></svg>
</template>
</body>
</html>
